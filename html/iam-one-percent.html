<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!--
  Motiv · In-App Message: 1% BETTER GOAL UPDATE (two-page reveal, same skeleton as
  the goal-based challenges IAM version C).

  Page 1 = teaser: GOAL UPDATE pill + "Your goal now moves with you..." (typed).
  Page 2 = "We help you get 1% better every day": body copy, animated goal-bar card
           (your 30d average + the 1% cap, numbers tick 7,412 -> 7,486), three
           how-it-works rows, CTA. Advances on tap only; the X appears 3s after page 2.

  Paste into OneSignal > Messages > In-App > New In-App Message > HTML editor.
  Tapping outside the card does NOT dismiss (backdrop taps are swallowed; only the X closes).

  CTA: "See my new goal" tracks the click and closes the message (the user is already
  in the app; their new goal is on the home screen). To deep link somewhere instead,
  set DEEP_LINK below to a Branch URL and it will openUrl instead of close.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: transparent; }
  body { background: rgba(16, 24, 19, 0.5); } /* dimmed backdrop; taps on it do nothing */
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 18px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    background: #ffffff;
    border-radius: 22px;
    padding: 26px 0 20px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(20, 33, 26, 0.28);
    overflow: hidden;
  }
  .close-x {
    position: absolute; top: 14px; right: 14px; z-index: 5;
    width: 30px; height: 30px; border-radius: 50%;
    background: #EDF1EE; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .card.show-x .close-x { opacity: 1; pointer-events: auto; }
  .close-x:active { background: #DCEDE4; }

  /* ---- pager ---- */
  .pages {
    display: flex; width: 200%;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.p2 .pages { transform: translateX(-50%); }
  .page { width: 50%; flex-shrink: 0; padding: 0 22px; }

  /* ---- page 1: teaser ---- */
  #page-1 {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    gap: 18px; cursor: pointer;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 7px;
    color: #21835A; font-size: 12px; font-weight: 800;
    letter-spacing: 1.8px; text-transform: uppercase;
  }
  .eyebrow svg { flex-shrink: 0; }
  #page-1 h1 {
    font-size: 30px; line-height: 1.18; font-weight: 800; color: #182125;
    letter-spacing: -0.5px; min-height: 2.4em;
  }
  .p1-cta {
    opacity: 0; transform: translateY(8px);
    display: block; width: 100%;
    background: #21835A; color: #ffffff;
    border: none; border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    padding: 15px 16px; cursor: pointer;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .p1-cta:active { background: #17724A; }
  .p1-cta.in { opacity: 1; transform: none; }

  /* ---- page 2: the reveal ---- */
  .subhead {
    font-size: 18px; font-weight: 800; color: #21835A;
    letter-spacing: -0.2px; margin-bottom: 5px; margin-top: 2px;
    text-align: center; padding: 0 16px; line-height: 1.3;
    min-height: 2.6em; /* two lines reserved: typing must not change the card height */
    transform: translateY(var(--intro-shift, 0)) scale(1.12);
    transform-origin: 50% 50%;
  }
  #subhead-text { white-space: pre-line; }
  .type-caret {
    display: inline-block; width: 2.5px; height: 1em;
    background: #21835A; margin-left: 3px; vertical-align: -0.12em;
    animation: caret-blink 0.85s step-end infinite;
  }
  .typed .type-caret { display: none; }
  @keyframes caret-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  #page-2.revealed .subhead {
    transform: none;
    transition: transform 1.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .p2-rest { opacity: 0; transform: translateY(12px); }
  #page-2.revealed .p2-rest {
    opacity: 1; transform: none;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }
  #page-2.revealed .goal-card { transition-delay: 0.95s; }

  /* ---- animated goal card: the vertical bar is the hero ---- */
  .goal-card {
    border: 1px solid #E3E1DD;
    border-radius: 16px;
    padding: 16px 16px 12px;
    margin-bottom: 18px;
  }
  .goal-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px;
    color: #7C8A82; text-transform: uppercase; margin-bottom: 10px;
    text-align: center;
  }
  .gbar svg { display: block; width: 100%; height: auto; }
  .gbar .avg-rect {
    transform: scaleY(0); transform-origin: 150px 168px;
  }
  .goal-card.play .avg-rect {
    transform: scaleY(1);
    transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .gbar .plus-g {
    opacity: 0; transform: translateY(-16px) scale(0.6); transform-origin: 150px 40px;
  }
  .goal-card.play .plus-g {
    opacity: 1; transform: none;
    transition: opacity 0.2s ease 1s, transform 0.5s cubic-bezier(0.34, 1.8, 0.64, 1) 1s;
  }
  .gbar .lab-a { opacity: 0; }
  .goal-card.play .lab-a { opacity: 1; transition: opacity 0.45s ease 0.75s; }
  .gbar .lab-g { opacity: 0; }
  .goal-card.play .lab-g { opacity: 1; transition: opacity 0.45s ease 1.45s; }
  .goal-cap {
    font-size: 12px; font-weight: 600; color: #7C8A82;
    text-align: center; margin: 8px 0 2px;
  }

  .cta {
    opacity: 0; transform: translateY(10px); pointer-events: none;
    display: block; width: 100%;
    background: #21835A; color: #ffffff;
    border: none; border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    padding: 15px 16px; cursor: pointer;
  }
  .cta:active { background: #17724A; }
  #page-2.cta-in .cta {
    opacity: 1; transform: none; pointer-events: auto;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .resetting .avg-rect, .resetting .plus-g, .resetting .lab-a, .resetting .lab-g { transition: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .pages, #page-1 h1, .p1-cta { transition: none !important; animation: none !important; }
    #page-1 h1, .p1-cta { opacity: 1 !important; transform: none !important; }
    .subhead { transform: none !important; transition: none !important; }
    .type-caret { display: none !important; }
    .p2-rest { opacity: 1 !important; transform: none !important; transition: none !important; }
    .gbar .avg-rect, .gbar .plus-g, .gbar .lab-a, .gbar .lab-g { opacity: 1 !important; transform: none !important; transition: none !important; }
    .cta { opacity: 1 !important; transform: none !important; pointer-events: auto !important; }
  }
</style>
</head>
<body>
  <div class="card" id="iam-card">
    <button class="close-x" id="cta-dismiss" data-onesignal-unique-label="one-percent-launch-dismiss" aria-label="Dismiss"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 1.5L10.5 10.5M10.5 1.5L1.5 10.5" stroke="#7d8a80" stroke-width="2" stroke-linecap="round"/></svg></button>

    <div class="pages" id="pages">

      <!-- page 1: teaser -->
      <div class="page" id="page-1" data-onesignal-unique-label="one-percent-launch-page1">
        <span class="eyebrow">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#21835A"><path d="M12 2l2.4 6.8L21 11l-6.6 2.2L12 20l-2.4-6.8L3 11l6.6-2.2L12 2z"/></svg>
          Goal update
        </span>
        <h1 id="p1-title"><span id="p1-text">Your goal now moves with you...</span><span class="type-caret" aria-hidden="true"></span></h1>
        <button class="p1-cta" id="p1-cta">See what's new</button>
      </div>

      <!-- page 2: the reveal -->
      <div class="page" id="page-2">
        <p class="subhead" id="subhead"><span id="subhead-text">We help you get&#10;1% better every day</span><span class="type-caret" aria-hidden="true"></span></p>
        <div class="goal-card p2-rest" id="goal-card" aria-hidden="true">
          <div class="goal-label">How your new goal works</div>
          <div class="gbar">
            <svg viewBox="0 0 300 176" aria-label="Your goal is 1% above your 30-day average">
              <rect class="avg-rect" x="122" y="56" width="56" height="112" rx="6" fill="#21835A"/>
              <g class="plus-g">
                <rect x="122" y="30" width="56" height="24" rx="6" fill="#7ED9A7"/>
                <text x="150" y="46.5" text-anchor="middle" font-size="12" font-weight="800" fill="#1E4A34">+1%</text>
              </g>
              <g class="lab-a"><line x1="12" y1="56" x2="118" y2="56" stroke="#7C8A82" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/><text x="12" y="44" font-size="11" font-weight="700" fill="#7C8A82" letter-spacing=".04em">30-DAY AVERAGE</text><text x="12" y="76" font-size="16" font-weight="800" fill="#7C8A82">10,000</text></g>
              <g class="lab-g"><line x1="182" y1="30" x2="288" y2="30" stroke="#21835A" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/><text x="288" y="18" text-anchor="end" font-size="11" font-weight="700" fill="#21835A" letter-spacing=".04em">DAILY GOAL</text><text id="goal-count" x="288" y="52" text-anchor="end" font-size="19" font-weight="800" fill="#21835A">10,000</text></g>
            </svg>
          </div>
          <div class="goal-cap">Example shown. Yours is based on your own last 30 days.</div>
        </div>

        <button class="cta" id="cta-try" data-onesignal-unique-label="one-percent-launch-cta">
          See my new goal
        </button>
      </div>
    </div>

  </div>

  <script>
    // Leave empty to track + close on CTA (user lands on home, where the goal lives).
    // Set to a Branch URL to deep link instead.
    var DEEP_LINK = "";

    var AVG_STEPS = 10000, GOAL_STEPS = 10100;
    var TICK_DELAY_MS = 1450, TICK_MS = 750, LOOP_MS = 7000, X_DELAY_MS = 3000;
    var SUBHEAD_TEXT = "We help you get" + String.fromCharCode(10) + "1% better every day";
    var P1_TYPE_START_MS = 500, P1_TYPE_MS = 75, TYPE_START_MS = 550, TYPE_MS = 50, HOLD_AFTER_TYPE_MS = 1100, REVEAL_MS = 2700;

    var onPage2 = false;

    function animateGoalBar() {
      var goal = document.getElementById("goal-card");
      var count = document.getElementById("goal-count");
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduced) {
        goal.classList.add("play");
        count.textContent = GOAL_STEPS.toLocaleString("en-US");
        document.getElementById("page-2").classList.add("cta-in");
        return;
      }

      goal.classList.add("play");

      setTimeout(function () {
        var t0 = null;
        function tick(ts) {
          if (t0 === null) t0 = ts;
          var p = Math.min((ts - t0) / TICK_MS, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          count.textContent = Math.round(AVG_STEPS + (GOAL_STEPS - AVG_STEPS) * eased).toLocaleString("en-US");
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }, TICK_DELAY_MS);

      setTimeout(function () {
        document.getElementById("page-2").classList.add("cta-in"); // stays once shown
      }, TICK_DELAY_MS + 1500);

      setTimeout(function () {
        var card = document.getElementById("iam-card");
        card.classList.add("resetting");
        goal.classList.remove("play");
        count.textContent = AVG_STEPS.toLocaleString("en-US");
        void card.offsetWidth;
        card.classList.remove("resetting");
        setTimeout(animateGoalBar, 700);
      }, LOOP_MS);
    }

    function goToPage2(e) {
      if (onPage2) return;
      onPage2 = true;
      if (e && window.OneSignalIamApi && OneSignalIamApi.trackClick) {
        try { OneSignalIamApi.trackClick(e); } catch (err) {}
      }
      var card = document.getElementById("iam-card");
      var page2 = document.getElementById("page-2");
      card.classList.add("p2");
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) {
        document.getElementById("subhead").classList.add("typed");
        page2.classList.add("revealed");
        setTimeout(animateGoalBar, 700);
      } else {
        var txt = document.getElementById("subhead-text");
        txt.textContent = "";
        setTimeout(function () {
          var i = 0;
          var typer = setInterval(function () {
            i++;
            txt.textContent = SUBHEAD_TEXT.slice(0, i);
            if (i >= SUBHEAD_TEXT.length) {
              clearInterval(typer);
              document.getElementById("subhead").classList.add("typed");
              setTimeout(function () {
                page2.classList.add("revealed");
                setTimeout(animateGoalBar, REVEAL_MS);
              }, HOLD_AFTER_TYPE_MS);
            }
          }, TYPE_MS);
        }, TYPE_START_MS);
      }
      setTimeout(function () { card.classList.add("show-x"); }, X_DELAY_MS);
    }

    function initIam() {
      try {
        var page2El = document.getElementById("page-2");
        var sh = page2El.querySelector(".subhead");
        var p2r = page2El.getBoundingClientRect(), shr = sh.getBoundingClientRect();
        var shift = Math.max(0, (p2r.top + p2r.height / 2) - (shr.top + shr.height / 2));
        sh.style.setProperty("--intro-shift", shift.toFixed(0) + "px");
      } catch (err) { /* fall back to the CSS default */ }

      document.getElementById("cta-try").addEventListener("click", function (e) {
        OneSignalIamApi.trackClick(e);
        if (DEEP_LINK) {
          OneSignalIamApi.openUrl(e, DEEP_LINK);
        } else {
          OneSignalIamApi.close(e);
        }
      });
      document.getElementById("cta-dismiss").addEventListener("click", function (e) {
        OneSignalIamApi.close(e);
      });
      document.getElementById("page-1").addEventListener("click", goToPage2);

      document.body.addEventListener("click", function (e) {
        if (!e.target.closest || !e.target.closest(".card")) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);

      // page-1 title types out like page 2's header
      try {
        var p1h1 = document.getElementById("p1-title");
        var p1txt = document.getElementById("p1-text");
        var hint = document.getElementById("p1-cta");
        var P1_TEXT = p1txt.textContent;
        var reducedInit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reducedInit) {
          p1h1.classList.add("typed");
          hint.classList.add("in");
        } else {
          p1txt.textContent = "";
          setTimeout(function () {
            var i = 0;
            var typer = setInterval(function () {
              i++;
              p1txt.textContent = P1_TEXT.slice(0, i);
              if (i >= P1_TEXT.length) {
                clearInterval(typer);
                p1h1.classList.add("typed");
                hint.classList.add("in");
              }
            }, P1_TYPE_MS);
          }, P1_TYPE_START_MS);
        }
      } catch (err) { /* title stays static */ }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initIam);
    } else {
      initIam();
    }
  </script>
</body>
</html>
